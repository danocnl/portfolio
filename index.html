<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dan O'Connell — Product Designer & Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .landing-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 4rem var(--page-x);
    overflow: hidden;
  }

  .landing-hero {
    padding: clamp(4rem, 20dvh, 20rem) 0 4rem;
  }

  .landing-name {
    font-family: 'Manrope', sans-serif;
    font-size: 4.5rem;
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 0.92;
    color: var(--text);
    margin-bottom: -1rem;
  }

  .landing-tagline {
    font-family: 'Manrope', sans-serif;
    font-size: 4.5rem;
    font-weight: 500;
    letter-spacing: -0.05em;
    color: var(--text-body-light);
    margin-bottom: 4rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }

  .landing-intro {
    font-size: 1.5rem;
    color: var(--text-body);
    max-width: 70%;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .landing-footer-text {
    font-family: 'Geist Mono', monospace;
    font-size: 1rem;
    text-transform: uppercase;
    color: var(--text-subtle);
    padding-bottom: 3rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-name"><span class="name">Dan O'Connell</span><span class="tagline"> Product designer &amp; Engineer</span></div>
</header>

<div class="landing-area">
  <div class="landing-hero">
    <div class="landing-name" id="landing-name">Dan O'Connell</div>
    <div class="landing-tagline" id="landing-tagline">Designing software. Building it too.</div>
    <div class="landing-intro" id="landing-intro">Products taken from startup to acquisition. Designing, building &amp; delivering at every stage, from research to shipping production code.</div>
  </div>
  <div class="landing-footer-text" id="landing-status">Full portfolio coming soon.</div>
</div>

<script>
function scramble(element, newText, duration) {
  const noiseChars = '!@#$%&*·&<>+-=~#';
  const totalFrames = 28;
  const frameInterval = duration / totalFrames;
  let frame = 0;

  element.textContent = newText.split('').map(ch =>
    ch === ' ' ? ' ' : noiseChars[Math.floor(Math.random() * noiseChars.length)]
  ).join('');

  const tick = setInterval(() => {
    frame++;
    const t = frame / totalFrames;
    const resolved = Math.floor((t * t) * newText.length);
    element.textContent = newText.split('').map((ch, i) => {
      if (ch === ' ') return ' ';
      if (i < resolved) return ch;
      return noiseChars[Math.floor(Math.random() * noiseChars.length)];
    }).join('');

    if (frame >= totalFrames) {
      clearInterval(tick);
      element.textContent = newText;
    }
  }, frameInterval);
}

function scrambleFromDOM(el, duration) {
  if (!el) return;
  scramble(el, el.textContent.trim(), duration);
}

scrambleFromDOM(document.querySelector('.header-name .name'),    340);
scrambleFromDOM(document.querySelector('.header-name .tagline'), 340);
scrambleFromDOM(document.getElementById('landing-name'),         450);
scrambleFromDOM(document.getElementById('landing-tagline'),      540);
scrambleFromDOM(document.getElementById('landing-intro'),        600);
scrambleFromDOM(document.getElementById('landing-status'),       700);

document.querySelectorAll('.header-nav li:not(.divider) a span').forEach(el => {
  scrambleFromDOM(el, 450);
});
</script>
</body>
</html>
